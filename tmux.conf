# set default underlying shell
set -g default-command "/bin/zsh"
set -g default-shell "/bin/zsh"

# Extended keys — lets tmux distinguish Ctrl+Shift+<letter> from Ctrl+<letter>.
# Used below for the 5-step resize bindings. Terminal must support CSI u /
# modifyOtherKeys / kitty keyboard protocol (iTerm2 3.5+, Ghostty, Kitty,
# WezTerm, Konsole, Alacritty ≥ 0.13, GNOME Terminal / VTE ≥ 0.76).
# Where extended keys aren't supported, Ctrl+Shift+hjkl silently no-ops and
# you can fall back to Ctrl+Meta+hjkl (always works via Alt=Meta).
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'ghostty*:extkeys'

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# move pane to/from window
bind-key q command-prompt -p "join pane from:"  "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:"  "join-pane -t '%%'"
bind-key ! break-pane -d -n _hidden_pane
bind-key @ join-pane -s $:_hidden_pane.0
unbind j

# switch panes using prefix + arrow
bind-key -T prefix Left select-pane -L
bind-key -T prefix Right select-pane -R
bind-key -T prefix Up select-pane -U
bind-key -T prefix Down select-pane -D

# switch panes using Ctrl+hjkl (vim-aware: passes keys through to vim/neovim)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

# set resizing through keys
bind-key -r -T prefix       M-Up              resize-pane -U 5
bind-key -r -T prefix       M-Down            resize-pane -D 5
bind-key -r -T prefix       M-Left            resize-pane -L 5
bind-key -r -T prefix       M-Right           resize-pane -R 5
bind-key -r -T prefix       C-Up              resize-pane -U
bind-key -r -T prefix       C-Down            resize-pane -D
bind-key -r -T prefix       C-Left            resize-pane -L
bind-key -r -T prefix       C-Right           resize-pane -R

# Prefix-less resize via Ctrl+Meta+hjkl (step 1, universal support).
bind-key -n -r             C-M-h             resize-pane -L
bind-key -n -r             C-M-j             resize-pane -D
bind-key -n -r             C-M-k             resize-pane -U
bind-key -n -r             C-M-l             resize-pane -R

# Prefix-less resize via Ctrl+Shift+hjkl (step 5, needs extended-keys +
# terminal support; see the `extended-keys` note at the top of this file).
bind-key -n -r             C-S-h             resize-pane -L 5
bind-key -n -r             C-S-j             resize-pane -D 5
bind-key -n -r             C-S-k             resize-pane -U 5
bind-key -n -r             C-S-l             resize-pane -R 5

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# don't rename windows automatically
set-option -g allow-rename on

# remember history across sessions
set -g history-file ~/.tmux_history

# toggle status bar
bind-key b set-option status

### PLUGINS

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

# List of plugins
set -g @tpm_plugins '
    tmux-plugins/tpm \
    tmux-plugins/tmux-sensible \
    tmux-plugins/tmux-resurrect \
    tmux-plugins/tmux-continuum \
    niksingh710/minimal-tmux-status \
    sainnhe/tmux-fzf \
    tmux-plugins/tmux-yank \
'    

# enhanced session history
set -g @continuum-restore 'on'

# Theme
set -g @minimal-tmux-bg "#00FBB0"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run "${TMUX_PLUGIN_MANAGER_PATH}tpm/tpm"
