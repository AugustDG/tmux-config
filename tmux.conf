# set default underlying shell; -l makes panes login shells so macOS
# path_helper runs (restores /usr/local/bin when the server starts with the
# bare GUI environment, e.g. launched directly by Ghostty). Hosts without zsh
# keep tmux's default, the login shell.
if-shell '[ -x /bin/zsh ]' {
    set -g default-command "/bin/zsh -l"
    set -g default-shell "/bin/zsh"
}

# Preserve extended keys for applications when supported by the terminal.
set -s extended-keys on
# tmux 3.5+; -q skips it on older servers (Ubuntu 24.04 ships 3.4)
set -gq extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'ghostty*:extkeys'

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# move pane to/from window
bind-key q command-prompt -p "join pane from:"  "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:"  "join-pane -t '%%'"
bind-key ! break-pane -d -n _hidden_pane
bind-key @ join-pane -s $:_hidden_pane.0
unbind j

# switch panes using prefix + arrow
bind-key -T prefix Left select-pane -L
bind-key -T prefix Right select-pane -R
bind-key -T prefix Up select-pane -U
bind-key -T prefix Down select-pane -D

# set resizing through keys
bind-key -r -T prefix       M-Up              resize-pane -U 5
bind-key -r -T prefix       M-Down            resize-pane -D 5
bind-key -r -T prefix       M-Left            resize-pane -L 5
bind-key -r -T prefix       M-Right           resize-pane -R 5
bind-key -r -T prefix       C-Up              resize-pane -U
bind-key -r -T prefix       C-Down            resize-pane -D
bind-key -r -T prefix       C-Left            resize-pane -L
bind-key -r -T prefix       C-Right           resize-pane -R

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Forward wheel events to mouse-aware applications; otherwise use tmux scrollback.
bind-key -n WheelUpPane if-shell -F -t = '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'copy-mode -e -t ='
bind-key -n WheelDownPane send-keys -M

# Allow applications such as Po's fullscreen TUI to copy via OSC 52.
set -s set-clipboard on

# don't rename windows automatically
set-option -g allow-rename on

# remember history across sessions
set -g history-file ~/.tmux_history

# toggle status bar
bind-key b set-option status

# ws picker (projects and sessions) in a popup; replaces the default find-window
bind-key f display-popup -E -w 70% -h 60% -T " ws " "ws"

### PLUGINS

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

# List of plugins
set -g @tpm_plugins '
    tmux-plugins/tpm \
    tmux-plugins/tmux-sensible \
    sainnhe/tmux-fzf \
    tmux-plugins/tmux-yank \
'

### THEME

# config-time variables: style options don't expand #{@option} references,
# so the palette is substituted while the file is parsed
%hidden ACCENT="#0f8f7e"
%hidden ALERT="#c26a00"
%hidden DIM="#7c7f8a"
# a server reached over ssh (ws ssh) gets amber, so it's never mistaken for local
%if "#{!=:$SSH_CONNECTION,}"
%hidden ACCENT="#c26a00"
%endif

# sessions, not windows: the bar lists every session and highlights this one;
# it turns inverse while the prefix is held, and background sessions with
# activity show in amber
set -g status-position top
set -g status-justify left
set -g status-style "bg=default,fg=${DIM}"
set -g status-left-length 120
set -g status-left "#{S:#{?#{==:#{session_name},#{client_session}},#{?client_prefix,#[fg=#ffffff bg=${ACCENT} bold],#[fg=${ACCENT} bold]} #{session_name} #[default],#{?session_alerts,#[fg=${ALERT}],#[fg=${DIM}]} #{session_name} #[default]}}"
set -g window-status-format ""
set -g window-status-current-format ""
set -g window-status-separator ""
set -g status-right-length 40
set -g status-right "#[fg=${ACCENT} bold]#{?pane_in_mode,COPY ,}#{?window_zoomed_flag,ZOOM ,}#{?synchronize-panes,SYNC ,}"

# pane borders: active in accent, the rest dim
set -g pane-border-lines single
set -g pane-border-style "fg=${DIM}"
set -g pane-active-border-style "fg=${ACCENT}"

# popups (ws picker included), copy-mode selection, prompt and messages
set -g popup-border-lines rounded
set -g popup-border-style "fg=${ACCENT}"
set -g mode-style "fg=#ffffff,bg=${ACCENT}"
set -g message-style "fg=${ACCENT},bg=default,bold"
set -g message-command-style "fg=${ACCENT},bg=default"
set -g clock-mode-colour "${ACCENT}"

# activity in other sessions feeds the amber highlight above, without popups
set -g monitor-activity on
set -g visual-activity off

# Ghostty's window/tab title follows the session
set -g set-titles on
set -g set-titles-string "#S"

# killing a session moves to another one instead of detaching
set -g detach-on-destroy off

# prefix + ( / ) cycle sessions; repeatable, so hold the prefix and keep tapping
bind-key -r ( switch-client -p
bind-key -r ) switch-client -n

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# $VARs expand when the file is parsed, before set-environment above runs,
# so this can't use TMUX_PLUGIN_MANAGER_PATH on a fresh server
run "$HOME/.config/tmux/plugins/tpm/tpm"
